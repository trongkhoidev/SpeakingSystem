[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"

# This file is for the backend service if you deploy it from the root.
# However, it's recommended to set the 'Root Directory' in Railway settings
# to 'backend' for the backend service and 'frontend' for the frontend service.
